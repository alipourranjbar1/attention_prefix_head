[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "four-anchor-dflash"
version = "0.1.0"
description = "Four-anchor, shared-weight two-pass DFlash research pipeline"
requires-python = ">=3.10"
dependencies = [
  "transformers==5.0.0", "safetensors>=0.5", "pydantic>=2", "pydantic-settings",
  "loguru", "rich", "httpx", "openai>=2", "aiohttp", "protobuf",
  "datasets>=4,<=5.0.1", "tqdm>=4.66.3,<=4.70.0", "fastapi", "uvicorn"
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx"]

[project.scripts]
dflash4a = "four_anchor.cli:main"

[tool.setuptools.packages.find]
include = ["four_anchor*"]
exclude = ["four_anchor.tests*"]

[tool.pytest.ini_options]
testpaths = ["four_anchor/tests"]
